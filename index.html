<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0", lang="en">
    <script src="init.min.js"></script>
    <title>AuGoWolf</title>
    <link rel="shortcut icon" href="assets/logo-ico.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="align-self-end" id="idHeader">
        <img src="./assets/logo-square.png" style="height: 2.5em; width: auto; object-fit: cover; filter: brightness(0) saturate(100%) invert(93%) sepia(1%) saturate(3051%) hue-rotate(325deg) brightness(101%) contrast(108%);">
        AuGoWolf
    </header>
    
    <main>
        <div id="idControls">
            <div id="idFullscreenControls">
                <div id="fileSettings">
                    <h2>File Settings</h2>
    
                    <div id="idUploadFile" name="nameUploadFile">
                        <input type="file" id="idFileInput" accept="image/png,image/jpeg,video/mp4,video/mkv">
                    </div>
                </div>
    
                <div id="viewSettings">
                    <h2>View Layout</h2>
                    
                    <input type="text" name="nameLayoutNameText" id="idLayoutNameText" placeholder="Unnamed Layout">

                    <div>
                        <input type="text" name="nameViewLabelText" id="idLabelText" placeholder="View Label">
                    
                        <button id="idAddLabelBtn" type="button">Add View</button>
                        <button id="idAddEmptyViewBtn" type="button">Add Empty</button>
        
                        <p>
                            Visible Views: <span id="idVisibleViewCount">0</span><br>
                            Empty Views: <span id="idEmptyViewCount">0</span><br>
                            Total Views: <span id="idTotalViewCount">0</span>
                        </p>

                        <button id="idDeleteAllViewsBtn" type="button" disabled>Delete all Views</button>
        
                        <div>
                            <label for="idColumnAmount">Columns (1 or more)</label>
                            <input type="number" name="nameColumnLabel" id="idColumnAmount" min="1" value="3">
                        </div>
        
                        <div>
                            <label for="idLayoutUrl">Layout URL: </label>
                            <input type="text" name="nameLayoutUrl" id="idLayoutUrl">
                            <button id="idGenerateLayoutUrlBtn" type="button">Generate URL</button>
                        </div>
                    </div>
                    
    
                    <button id="idEnterFullscreen" type="button">Enter Fullscreen</button>
                </div>
            </div>

            <button id="idExitFullscreen" type="button" hidden>Exit Fullscreen</button>
            
            <label>
                Simple Mode: 
                <input type="checkbox" name="nameSimpleMode" id="idSimpleModeCheckbox">
            </label>

            <div id="idVideoControls" hidden class="centre">
                <div>
                    <span id="idVideoTimestamp">00:00</span>
                    <span>/</span>
                    <span id="idVideoLength">mm:ss</span>
                </div>
                <div>
                    <button id="idVideoPlayBtn" type="button">Play</button>
                    <button id="idVideoRestartBtn" type="button">Restart</button>
                </div>
                <div>
                    <button id="idVideoSubtract10Btn">-10s</button>
                    <button id="idVideoSubtract5Btn">-5s</button>
                    <button id="idVideoAdd5Btn">+5s</button>
                    <button id="idVideoAdd10Btn">+10s</button>
                </div>
                <button id="idVideoMuteBtn" type="button">Mute</button>
                <button id="idVideoLoopBtn" type="button">Loop</button>
            </div>
        </div>

        <!-- Source elements -->
         <div id="idMasterSourceContainer" hidden> <!-- Size gets determined by size of the img / video inside? -->
            <img id="idMasterImage" class="viewImage">
            <video id="idMasterVideo" class="viewVideo"></video>
        </div>
        
        <!-- One cloned per view, kept out of render tree until cloned -->
        <template id="idViewTemplate">
            <div class="view">
                <p class="viewLabel"></p>
                <label for="idShaderType">
                    Shader Type
                    <select class="shaderType">
                        <option value="NONE">None</option>
                        <option value="ACHROMATOPSIA">Achromatopsia</option>
                        <option value="PROTANOPIA">Protanopia</option>
                        <option value="DEUTERANOPIA">Deuteranopia</option>
                        <option value="TRITANOPIA">Tritanopia</option>
                    </select>
                </label>
                <label>
                    Severity: <span class="severityLabel">0.5</span>
                    <input
                        type="range"
                        class="shaderSeverity"
                        min="0.0"
                        max="1.0"
                        step="0.01"
                    >
                </label>

                <!-- Actual rendered output -->
                <div class="canvasContainer" hidden>
                    <canvas class="glslCanvas"></canvas>
                </div>

                <button class="deleteBtn" type="button">Delete</button>
            </div>
        </template>

        <!-- No name required, just used for forcing layout shapes -->
        <template id="idEmptyViewTemplate">
            <div class="emptyView">
                <button class="deleteBtn" type="button">Delete</button>
            </div>
        </template>

        <div id="idViewsContainer"></div>
    </main>

    <footer id="idFooter">
        <a href="https://jakedaspud.github.io/JakeDaSpud/" target="_blank">jake o'reilly</a> | 2026
    </footer>

    <script src="colour_lab.js"></script>
    <script src="script.js"></script>
</body>
</html>
